name: Frontend CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python (para os hooks de validação de commit/branch)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit (ESLint + Prettier + hooks)
        run: pre-commit run --all-files

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # o SonarQube Cloud usa o histórico do git para saber o que é código novo
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # Além do resultado no log, gera coverage/lcov.info e test-report.xml
      - name: Run unit tests
        run: npm run test:unit:ci

      # Guarda o histórico de resultados e cobertura no SonarQube Cloud.
      # Roda mesmo com teste falhando, para a falha também ficar no histórico.
      # Fica desligado até o secret SONAR_TOKEN ser cadastrado no repositório.
      - name: SonarQube Cloud scan
        if: ${{ !cancelled() && env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.5.0

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run integration tests
        run: npm run test:integration
